name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Verify fixed debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "ERROR: debug.keystore not found in repo root. It must be committed once so every build is signed with the same key, allowing updates to install over old versions."
            exit 1
          fi
          echo "Using committed fixed debug.keystore (same signature across all builds)."

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Fluency-Friend-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
